<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">aws-typescript — Clinic Scheduling Platform (AWS)</text>
  <text x="20" y="56" font-size="13" fill="#64748b">Serverless: API Gateway + Lambda + DynamoDB + SNS/SQS + EventBridge + RDS, Clean Architecture (TypeScript)</text>

  <!-- Client -->
  <g>
    <rect x="30" y="110" width="180" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Cliente</text>
    <text x="120" y="153" text-anchor="middle" font-size="10.5" fill="#4338ca">agent / insured (JWT)</text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect x="260" y="110" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="350" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">API Gateway</text>
    <text x="350" y="153" text-anchor="middle" font-size="10" fill="#1e40af">Lambda Authorizer (JWT)</text>
  </g>

  <!-- Stage A -->
  <g>
    <rect x="260" y="220" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="350" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">createAppointment λ</text>
    <text x="350" y="263" text-anchor="middle" font-size="10" fill="#166534">crea PENDING</text>
  </g>

  <g>
    <ellipse cx="130" cy="250" rx="90" ry="35" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="130" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">DynamoDB</text>
    <text x="130" y="263" text-anchor="middle" font-size="9.5" fill="#92400e">appointments + events</text>
  </g>

  <!-- SNS/SQS -->
  <g>
    <rect x="500" y="220" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="575" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">SNS Topic</text>
    <text x="575" y="263" text-anchor="middle" font-size="10" fill="#854d0e">AppointmentCreated</text>
  </g>

  <g>
    <rect x="700" y="220" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="775" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">SQS Queue</text>
    <text x="775" y="263" text-anchor="middle" font-size="10" fill="#854d0e">+ DLQ</text>
  </g>

  <!-- Stage worker -->
  <g>
    <rect x="900" y="220" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="990" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">countryWorker λ</text>
    <text x="990" y="263" text-anchor="middle" font-size="10" fill="#166534">persiste relacional</text>
  </g>

  <g>
    <ellipse cx="990" cy="340" rx="100" ry="35" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="990" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">MySQL RDS</text>
    <text x="990" y="353" text-anchor="middle" font-size="9.5" fill="#92400e">country booking</text>
  </g>

  <!-- EventBridge -->
  <g>
    <rect x="700" y="340" width="150" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="775" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">EventBridge</text>
    <text x="775" y="383" text-anchor="middle" font-size="10" fill="#86198f">AppointmentConfirmed</text>
  </g>

  <g>
    <rect x="500" y="340" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="575" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">SQS confirmaciones</text>
    <text x="575" y="383" text-anchor="middle" font-size="10" fill="#854d0e">+ DLQ</text>
  </g>

  <!-- Stage B confirm -->
  <g>
    <rect x="260" y="340" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="350" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">confirmAppointment λ</text>
    <text x="350" y="383" text-anchor="middle" font-size="10" fill="#166534">marca COMPLETED</text>
  </g>

  <!-- SES -->
  <g>
    <rect x="30" y="340" width="180" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="120" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">SES</text>
    <text x="120" y="383" text-anchor="middle" font-size="10" fill="#86198f">notificación email</text>
  </g>

  <!-- Observability -->
  <g>
    <rect x="900" y="110" width="230" height="70" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="1015" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">X-Ray + CloudWatch</text>
    <text x="1015" y="156" text-anchor="middle" font-size="10" fill="#86198f">tracing distribuido · logs JSON</text>
  </g>

  <!-- Notes -->
  <g>
    <rect x="30" y="440" width="1050" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="466" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="488" font-size="10.5" fill="#334155">• Flujo de confirmación en dos etapas desacopladas: countryWorker (etapa A, persiste en RDS) nunca marca el estado final ni notifica —</text>
    <text x="50" y="506" font-size="10.5" fill="#334155">  eso lo hace confirmAppointment (etapa B), disparado por EventBridge, igual que el patrón replicado en los hermanos Azure/GCP.</text>
    <text x="50" y="528" font-size="10.5" fill="#334155">• API Gateway usa un Lambda Authorizer propio que valida el JWT antes de invocar cualquier función de negocio.</text>
    <text x="50" y="550" font-size="10.5" fill="#334155">• Todas las colas SNS/SQS tienen DLQ; retry + circuit breaker envuelven las llamadas al bus de eventos (ver sección Resiliencia).</text>
  </g>

  <!-- Arrows -->
  <line x1="210" y1="140" x2="258" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="215" y="132" font-size="9.5" fill="#1d4ed8">HTTPS + JWT</text>

  <line x1="350" y1="170" x2="350" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="258" y1="250" x2="222" y2="250" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="440" y1="250" x2="498" y2="250" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="650" y1="250" x2="698" y2="250" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="850" y1="250" x2="898" y2="250" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="990" y1="280" x2="990" y2="303" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="900" y1="370" x2="852" y2="370" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="700" y1="370" x2="652" y2="370" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="500" y1="370" x2="442" y2="370" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="350" y1="340" x2="350" y2="282" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="356" y="315" font-size="9" fill="#92400e">COMPLETED</text>
  <line x1="260" y1="370" x2="212" y2="370" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="20" y="605" font-size="10.5" fill="#94a3b8">Hermano de agendamiento de citas en el trío AWS/Azure/GCP — mismo dominio y Clean Architecture, distinta nube (ver README para el diagrama Mermaid equivalente).</text>
</svg>
